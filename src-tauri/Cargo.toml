[package]
name = "nook"
version = "0.2.0"
description = "Nook — личный менеджер задач"
authors = ["volgi"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "nook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"

# Desktop only. A tray icon, an autostart entry and a system-wide hotkey have
# no counterpart on a phone, and these crates do not build for Android at all,
# so they must not even be compiled there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# No Windows backdrop crate on purpose: see the note in src/lib.rs about why
# the widget uses plain transparency and no blur.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
